<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Taskey</title>
    <meta name="Taskey" content=" This is a user friendly task mananger and to-do list app"/>
    <!-- <meta name="robots" content="index" /> -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width = device-width, initial-scale = 1.0" />
    <!--<link rel="stylesheet" type="text/css" href="CSS/login.css" />-->
     {% load static %}
    <link rel="stylesheet" href="{% static '/firstapp/login.css' %}" />
   <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>-->
    <script defer src="{% static 'firstapp/js/register.js' %}"></script>
  
  </head>
  <body>
    <div class="wrapper">
      <div class="auth-header">
        <img src="{% static '/firstapp/images/taskyie-logo.svg' %}" id="logo" alt="Logo"/> 
        {% if messages %}
             {% for message in messages %}
               <p>{{ message }}</p>
                 {% endfor %}
        {% endif %}
        <h5>Log in into your account</h5>
          </div>
             <div class="toggle_btn">
              <div class="toggle_control_left active" id="signin-toggle">
                 <p class="toggle_control_left_text"> Sign In </p> 
              </div>
              <div class="toggle_control_right" id="create-account-toggle">
                <p class="toggle_control_right_text"> Create Account</p>
              </div>
          
              
          </div>
             <form id="login-form" class="auth-form"  method="POST" action="/log_user_in/">
              {% csrf_token %}
              <div class="form-group">
                <label for="username" class="form-label">Email id:</label><br>
               <div class="input-span-wrapper">
                <input 
                  type="email" 
                  id="email" 
                  name="email" 
                  placeholder="   oluwatofunmi57@gmail.com" 
                  class="form-input"
                  required
                >
                <span class="icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
</svg>

                </span>
                </div>
              </div>
            
              <div class="form-group">
                <label for="password" class="form-label">Password</label><br>
               <div class="input-span-wrapper">
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  placeholder="   Enter your password" 
                  class="form-input"
                  required
                  >
                <span class="icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
</svg>

                </span>
               </div> 
              </div>
            
                        
              <div class="form-actions">
                <button type="submit" class="btn" id="signup"> Sign In</button>
              </div>
            </form>
           <!-- <div class="OR">
              <hr class="line">
              <p>OR</p>
              <hr class="line">
            </div>
          -->
           <!-- <div class="login-btn">
            <button type="submit" class="login" id="login">Log in</button>
              </div> -->
          <!--  <form id="form1">
              <label class="label-1">Username</label><br>
              <input type="Username" name="User" placeholder="Enter your Username E.g Ayomide" class="input"/>
              <br>
              <label class="label-1">Password</label><br>
              <input type="password" name="User" placeholder="Enter your Password E.g 5%dp" class="input" /> 
              <br>
              <input type="checkbox" name="color" value="yellow" class="first-check-box"/>
              <label class="label-2">Remember Me </label>
              <br>
              <input type="submit" name="Log in" value="Log in" class="submit"/><br>
              <button>Sign Up</button>
            </form>
         -->
  
      </div>  
  <script>
      const signInToggle = document.getElementById("signin-toggle");
      const createAccountToggle = document.getElementById("create-account-toggle");

      signInToggle.addEventListener("click", function () {
        signInToggle.classList.add("active");
        createAccountToggle.classList.remove("active");

         const form = document.getElementById("login-form");
        form.action = "/log_user_in/";

              // 1. Find the element using its ID
        const authButton = document.getElementById("signup");

        // 2. Change the text
        authButton.innerText = "Sign In";
      });

      createAccountToggle.addEventListener("click", function () {
        createAccountToggle.classList.add("active");
        signInToggle.classList.remove("active");

        const form = document.getElementById("login-form");
        form.action = "/create_account/";

        // 1. Find the element using its ID
        const authButton = document.getElementById("signup");

        // 2. Change the text
        authButton.innerText = "Create Account";

      });


  </script>
  </body>
</html>
