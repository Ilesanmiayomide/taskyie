         <form id="createNoteForm" action="{% url 'createNote' %}" method="POST">
            {% csrf_token %}
        <div class="form-field">
          <label for="noteTitle">Note title</label>
          <div class="title-input-wrap">

              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-type preview-icon"><path d="M12 4v16"/><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/><path d="M9 20h6"/></svg>

            <input id="noteTitle" name="title" type="text" maxlength="200" placeholder="Enter note title..." required>
        </div>  
        </div>  

    <div class="form-field">
        <label for="noteContent">Note content</label>  

          <div class="content-input-wrap">
  
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil preview-icon"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>

            <textarea id="noteContent"
                      name="content"
                      placeholder="Write your note here..." 
                      required>
            </textarea>

          </div>
    </div>
    <div class="sheet-footer"> 
        
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p> 
        <button class="submit-button" type="submit">
            
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save preview-icon"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
             Create Note</button>
        </div>
      </form>
