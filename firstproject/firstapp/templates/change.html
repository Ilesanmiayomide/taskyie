<body>
    <div class="wrapper">

        <!-- Top section -->
        <header class="top-section">

            <div class="logo-div">
                <img
                    src="{% static 'firstapp/images/taskyie-logo.svg' %}"
                    alt="Taskyie note app logo"
                    class="logo"
                >
            </div>

            <button class="settings-tab" type="button">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"
                    />
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                    />
                </svg>
            </button>

        </header>


        <main class="main-content">

            <!-- Page heading -->
            <div class="heading-row">
                <h1>My notes</h1>
            </div>


            <!-- Search -->
            <div class="search-row">

                <div class="search-box">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="m21 21-4.35-4.35m0 0A7.5 7.5 0 1 0 6.05 6.05a7.5 7.5 0 0 0 10.6 10.6Z"
                        />
                    </svg>

                    <input
                        type="text"
                        placeholder="Search notes..."
                    >

                </div>


                <button class="filter-button" type="button">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M3 4.5h18l-7 8.25v5.25l-4 2v-7.25L3 4.5Z"
                        />
                    </svg>

                </button>

            </div>


            <!-- Saved notes -->
            <section class="saved-notes-container">

                <article class="saved-note">

                    <div class="note-content">

                        <h2>UI/UX Design Tutorial with ...</h2>

                        
                        <p class="note-description">
                            A complete guide to modern UI/UX design principles, that shape the ...
                        </p>
                        
                        <p class="note-date">
                            30 Jun, 2026
                        </p>
                        <div class="note-tag">
                            <span></span>
                            Design
                        </div>

                    </div>


                    <button class="kebab-box" type="button">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="2"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 6.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 12.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5ZM12 18.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z"
                            />
                        </svg>

                    </button>

                </article>


                <!-- Empty state -->
                <div class="empty-state">

                    <div class="empty-icon">
                        <div class="box-top"></div>
                        <div class="box-body"></div>
                    </div>

                    <h2>No more notes</h2>

                    <p>Create a note to get started</p>

                </div>

            </section>

        </main>


        <!-- Bottom create note area -->
        <div class="text-place">

            <div class="write-icon">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.6"
                    stroke="currentColor"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
                    />
                </svg>

            </div>


            <textarea
                placeholder="Type something here..."
                class="input-class"
                id="write-note"
            ></textarea>


            <div class="divider"></div>


            <button class="save-input" type="button">
                <span class="plus">+</span>
                Create Note
            </button>

        </div>

    </div>
</body>
</html>
